<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIKSMORE — Handpicked Finds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --teal:#123832;
    --teal-deep:#0B2622;
    --teal-light:#1F5A50;
    --mustard:#E8A33D;
    --mustard-deep:#C9852A;
    --paper:#FAF7F0;
    --paper-dim:#F0EBDD;
    --ink:#20241F;
    --ink-soft:#5B6459;
    --line:#D9D2C1;
    --danger:#B5453A;
    --font-display:'Space Grotesk', sans-serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);}
  a{color:inherit;text-decoration:none;}
  button{font-family:var(--font-body);cursor:pointer;}

  /* ---------- Header ---------- */
  .site-header{
    background:var(--teal-deep);
    color:var(--paper);
    padding:22px 32px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
  }
  .brand{
    font-family:var(--font-display);
    font-weight:700;
    font-size:26px;
    letter-spacing:-0.02em;
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  .brand .dot{color:var(--mustard);}
  .site-nav{display:flex;gap:8px;align-items:center;}
  .site-nav a, .site-nav button{
    color:var(--paper);
    background:transparent;
    border:1px solid rgba(250,247,240,0.28);
    padding:8px 16px;
    border-radius:3px;
    font-size:13.5px;
    font-weight:500;
    transition:background .15s, border-color .15s;
  }
  .site-nav a:hover, .site-nav button:hover{background:rgba(250,247,240,0.1);border-color:rgba(250,247,240,0.5);}
  .site-nav select{
    color:var(--paper);
    background:var(--teal-deep);
    border:1px solid rgba(250,247,240,0.28);
    padding:8px 12px;
    border-radius:3px;
    font-size:13.5px;
    font-weight:500;
    font-family:var(--font-body);
  }
  .site-nav select:hover{border-color:rgba(250,247,240,0.5);}

  /* ---------- Disclosure ---------- */
  .disclosure{
    background:var(--paper-dim);
    border-bottom:1px solid var(--line);
    color:var(--ink-soft);
    font-size:12.5px;
    text-align:center;
    padding:8px 16px;
  }

  main{max-width:1140px;margin:0 auto;padding:36px 32px 80px;}

  /* ---------- Hero ---------- */
  .hero{margin-bottom:32px;}
  .hero h1{
    font-family:var(--font-display);
    font-size:clamp(28px,4vw,42px);
    margin:0 0 8px;
    letter-spacing:-0.02em;
  }
  .hero p{color:var(--ink-soft);margin:0;font-size:15.5px;max-width:560px;}

  .country-banner{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    background:var(--paper-dim);
    border:1px solid var(--line);
    border-radius:4px;
    padding:12px 16px;
    margin-bottom:24px;
    flex-wrap:wrap;
  }
  .country-banner span{font-size:13.5px;color:var(--ink-soft);}
  .country-banner span b{color:var(--ink);}
  .country-banner a{
    font-size:13px;
    font-weight:600;
    color:var(--teal-light);
    border:1px solid var(--line);
    padding:6px 12px;
    border-radius:3px;
    background:#fff;
  }
  .country-banner a:hover{background:var(--paper);}

  /* ---------- Controls ---------- */
  .controls{
    display:flex;
    gap:12px;
    margin:28px 0 30px;
    flex-wrap:wrap;
  }
  .controls input, .controls select{
    font-family:var(--font-body);
    padding:10px 14px;
    border:1px solid var(--line);
    border-radius:3px;
    background:#fff;
    font-size:14px;
    color:var(--ink);
  }
  .controls input{flex:1;min-width:200px;}

  /* ---------- Grid ---------- */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
    gap:28px;
  }
  .card{
    position:relative;
    background:#fff;
    border:1px solid var(--line);
    border-radius:4px;
    padding:20px 18px 18px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .price-tag{
    position:absolute;
    top:-11px;
    left:-10px;
    background:var(--mustard);
    color:var(--teal-deep);
    font-family:var(--font-mono);
    font-weight:600;
    font-size:14px;
    padding:6px 14px 6px 24px;
    clip-path:polygon(0 50%, 14px 0, 100% 0, 100% 100%, 14px 100%);
    transform:rotate(-5deg);
    box-shadow:2px 3px 5px rgba(0,0,0,0.22);
    z-index:2;
  }
  .price-tag::before{
    content:'';
    position:absolute;
    left:8px;top:50%;
    width:5px;height:5px;
    border-radius:50%;
    background:var(--paper);
    transform:translateY(-50%);
  }
  .card img{
    width:100%;
    height:170px;
    object-fit:contain;
    background:var(--paper-dim);
    border-radius:3px;
    margin-top:6px;
  }
  .card .cat{
    font-family:var(--font-mono);
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--teal-light);
  }
  .card h3{
    font-family:var(--font-display);
    font-size:17px;
    margin:0;
    line-height:1.3;
  }
  .card p.desc{
    font-size:13.5px;
    color:var(--ink-soft);
    margin:0;
    line-height:1.5;
    flex:1;
  }
  .card .buy-btn{
    display:inline-block;
    text-align:center;
    background:var(--teal);
    color:var(--paper);
    padding:10px 14px;
    border-radius:3px;
    font-weight:600;
    font-size:13.5px;
    margin-top:6px;
    border:none;
    transition:background .15s;
  }
  .card .buy-btn:hover{background:var(--teal-light);}

  .empty-state{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-soft);
  }
  .empty-state h3{font-family:var(--font-display);color:var(--ink);}

  /* ---------- Admin ---------- */
  .admin-wrap{max-width:640px;margin:60px auto;padding:0 24px;}
  .login-box{
    background:#fff;
    border:1px solid var(--line);
    border-radius:4px;
    padding:40px 36px;
  }
  .login-box h2{font-family:var(--font-display);margin-top:0;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--ink-soft);}
  .field input, .field textarea, .field select{
    width:100%;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:3px;
    font-family:var(--font-body);
    font-size:14px;
  }
  .field textarea{resize:vertical;min-height:70px;}
  .field .hint{
    font-size:12px;
    color:var(--ink-soft);
    margin-top:5px;
  }
  .btn-primary{
    background:var(--teal);
    color:var(--paper);
    border:none;
    padding:11px 20px;
    border-radius:3px;
    font-weight:600;
    font-size:14px;
  }
  .btn-primary:hover{background:var(--teal-light);}
  .btn-ghost{
    background:transparent;
    border:1px solid var(--line);
    padding:11px 18px;
    border-radius:3px;
    font-weight:600;
    font-size:14px;
    color:var(--ink);
  }
  .btn-ghost:hover{background:var(--paper-dim);}
  .error-msg{color:var(--danger);font-size:13px;margin-top:10px;}

  .dash-header{
    display:flex;justify-content:space-between;align-items:center;
    margin-bottom:24px;flex-wrap:wrap;gap:10px;
  }
  .dash-header h2{font-family:var(--font-display);margin:0;}

  .product-row{
    display:flex;gap:16px;align-items:center;
    background:#fff;border:1px solid var(--line);border-radius:4px;
    padding:14px 16px;margin-bottom:10px;
  }
  .product-row img{width:56px;height:56px;object-fit:contain;background:var(--paper-dim);border-radius:3px;}
  .product-row .info{flex:1;min-width:0;}
  .product-row .info .t{font-weight:600;font-size:14.5px;}
  .product-row .info .p{font-family:var(--font-mono);color:var(--teal-light);font-size:13px;}
  .row-actions{display:flex;gap:8px;}
  .row-actions button{
    border:1px solid var(--line);background:#fff;border-radius:3px;
    padding:6px 12px;font-size:12.5px;font-weight:600;
  }
  .row-actions button.edit:hover{background:var(--paper-dim);}
  .row-actions button.del{color:var(--danger);border-color:#e3c9c6;}
  .row-actions button.del:hover{background:#FBEFEE;}

  .form-card{
    background:#fff;border:1px solid var(--line);border-radius:4px;
    padding:26px;margin-bottom:26px;
  }
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .form-grid .full{grid-column:1 / -1;}
  .form-actions{display:flex;gap:10px;margin-top:8px;}

  .note{
    font-size:12.5px;color:var(--ink-soft);margin-top:8px;
  }

  /* ---------- Newsletter ---------- */
  .subscribe-section{
    margin-top:56px;
    background:var(--teal-deep);
    color:var(--paper);
    border-radius:6px;
    padding:36px 32px;
    display:flex;
    flex-wrap:wrap;
    gap:28px;
    align-items:center;
    justify-content:space-between;
  }
  .subscribe-copy{max-width:360px;}
  .subscribe-copy h3{
    font-family:var(--font-display);
    font-size:22px;
    margin:0 0 6px;
  }
  .subscribe-copy p{
    margin:0;
    font-size:13.5px;
    color:rgba(250,247,240,0.75);
  }
  .subscribe-form{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    flex:1;
    justify-content:flex-end;
  }
  .subscribe-form input{
    font-family:var(--font-body);
    padding:11px 14px;
    border:1px solid rgba(250,247,240,0.28);
    border-radius:3px;
    background:rgba(250,247,240,0.08);
    color:var(--paper);
    font-size:14px;
    min-width:180px;
  }
  .subscribe-form input::placeholder{color:rgba(250,247,240,0.55);}
  .subscribe-form input:focus{outline:none;border-color:var(--mustard);}
  .subscribe-form button{
    background:var(--mustard);
    color:var(--teal-deep);
    border:none;
    padding:11px 22px;
    border-radius:3px;
    font-weight:600;
    font-size:14px;
    white-space:nowrap;
  }
  .subscribe-form button:hover{background:var(--mustard-deep);}
  .subscribe-msg{
    width:100%;
    font-size:13px;
    margin-top:4px;
  }
  .subscribe-msg.ok{color:#9FE0B8;}
  .subscribe-msg.err{color:#F0A79E;}

  @media (max-width:600px){
    .form-grid{grid-template-columns:1fr;}
    main{padding:28px 18px 60px;}
    .site-header{padding:18px 18px;}
    .subscribe-section{padding:28px 20px;}
    .subscribe-form{justify-content:flex-start;}
    .subscribe-form input{flex:1;min-width:0;}
  }
</style>

<body>

<header class="site-header">
  <div class="brand">PIKSMORE<span class="dot">.</span></div>
  <nav class="site-nav" id="navArea"></nav>
</header>
<div class="disclosure">As an Amazon Associate, this site earns from qualifying purchases made through the links below.</div>

<main id="app"></main>

<script>
/* =========================================================
   CONFIG — change these to fit your site
   ========================================================= */
const SITE_NAME = "PIKSMORE";
// Change this before you publish the site anywhere. This is a
// simple client-side check, not real security — see notes below.
let ADMIN_PASSWORD = localStorage.getItem('sift_admin_pw') || "Riya@135171";

const STORAGE_KEY = 'sift_products';
const AUTH_KEY = 'sift_admin_session';
const SUBSCRIBERS_KEY = 'sift_subscribers';

// Google Apps Script "Web app" URL — handles BOTH the product catalog and
// newsletter subscribers, all in one Google Sheet (two tabs: "Products"
// and "Subscribers"). See apps-script-backend.gs for the script to deploy.
// This is the real source of truth for both — localStorage is only used
// as an instant-load cache, so clearing browser data won't lose anything.
// PASTE YOUR DEPLOYED WEB APP URL HERE:
const GOOGLE_APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyw2inlT5LUxVpwSxhvFMZFhpsrnUoJ3VaSnXACkb90wCwCDUvS1r2r0VoQbRIbN4TP/exec";

// Optional: a separate Google Apps Script Web App URL that uploads product
// images to a Drive folder and returns a public link, instead of embedding
// images directly in this browser's storage. See drive-upload-apps-script.gs
// for the script to deploy. Leave this as "" to keep using embedded uploads
// (images stored in this browser only).
const GOOGLE_DRIVE_UPLOAD_URL = "https://script.google.com/macros/s/AKfycbxyVhNrReXgTrwNRgWD1nJm-l0u4ypPN7kkDCScgls8tK6bwV5UsmUjLwxS2osTGVbYgw/exec";
// code = used internally & in the URL hash (#country/US)
// label = shown to visitors
const COUNTRIES = [
  { code: 'US', label: 'United States' },
  { code: 'IN', label: 'India' },
  { code: 'AE', label: 'UAE' }
];

// Currency shown per country. Edit the symbol/code here if you ever
// need to change it — everything else picks it up automatically.
const CURRENCIES = {
  US:  { symbol: '$',    code: 'USD' },
  IN:  { symbol: '₹',    code: 'INR' },
  AE:  { symbol: 'AED ', code: 'AED' },
  ALL: { symbol: '$',    code: 'USD' } // fallback for "All countries" products
};
function getCurrency(countryCode){
  return CURRENCIES[countryCode] || CURRENCIES.ALL;
}

/* =========================================================
   DATA LAYER
   ========================================================= */
// In-memory copy of the current product list, kept in sync with the
// Google Sheet backend. getProducts() reads this synchronously so the
// rest of the UI code doesn't need to change; refreshProductsFromServer()
// is what actually talks to the network.
let productsCache = [];

function getProducts(){
  return productsCache;
}
// Only used as a fallback/cache layer now — NOT the source of truth.
function cacheProductsLocally(list){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); }
  catch(e){ /* ignore quota errors on the cache — not critical */ }
}
function readLocalProductCache(){
  try{
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
  }catch(e){ return []; }
}

// Fetches the current product list from the Google Sheet backend and
// updates productsCache (plus the local cache). Falls back to whatever
// was last cached locally if the request fails or no backend URL is set.
async function refreshProductsFromServer(){
  if(!GOOGLE_APPS_SCRIPT_URL){
    productsCache = readLocalProductCache();
    return productsCache;
  }
  try{
    const res = await fetch(`${GOOGLE_APPS_SCRIPT_URL}?action=listProducts`);
    const data = await res.json();
    if(data && data.success && Array.isArray(data.products)){
      productsCache = data.products;
      cacheProductsLocally(productsCache);
    } else {
      throw new Error((data && data.error) || 'Unexpected response');
    }
  }catch(err){
    console.error('Could not load products from the server, using local cache instead:', err);
    productsCache = readLocalProductCache();
  }
  return productsCache;
}

// Saves (creates or updates) one product on the server, then refreshes
// the local cache. Returns true on success.
async function saveProductRemote(product){
  if(!GOOGLE_APPS_SCRIPT_URL){
    // No backend configured — fall back to local-only behavior so the
    // admin panel still works, but nothing will sync across browsers.
    const list = getProducts();
    const idx = list.findIndex(p => p.id === product.id);
    if(idx === -1) list.push(product); else list[idx] = product;
    cacheProductsLocally(list);
    productsCache = list;
    return true;
  }
  try{
    const res = await fetch(GOOGLE_APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'saveProduct', product })
    });
    const data = await res.json();
    if(!data || !data.success) throw new Error((data && data.error) || 'Save failed');
    await refreshProductsFromServer();
    return true;
  }catch(err){
    console.error('Could not save product to the server:', err);
    return false;
  }
}

// Deletes one product on the server, then refreshes the local cache.
async function deleteProductRemote(id){
  if(!GOOGLE_APPS_SCRIPT_URL){
    const list = getProducts().filter(p => p.id !== id);
    cacheProductsLocally(list);
    productsCache = list;
    return true;
  }
  try{
    const res = await fetch(GOOGLE_APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'deleteProduct', id })
    });
    const data = await res.json();
    if(!data || !data.success) throw new Error((data && data.error) || 'Delete failed');
    await refreshProductsFromServer();
    return true;
  }catch(err){
    console.error('Could not delete product on the server:', err);
    return false;
  }
}

async function seedIfEmpty(){
  if(getProducts().length === 0){
    const seedProduct = {
      id: cryptoId(),
      title: "Example Product — replace me",
      description: "This is a placeholder listing so you can see how the layout looks. Edit or delete it from the admin panel.",
      imageUrl: "https://placehold.co/400x300/FAF7F0/1F5A50?text=Product+Image",
      price: "19.99",
      category: "Example",
      country: "ALL",
      affiliateUrl: "https://www.amazon.com/",
      dateAdded: Date.now()
    };
    await saveProductRemote(seedProduct);
  }
}
function cryptoId(){
  return 'p_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8);
}
function isLoggedIn(){
  return sessionStorage.getItem(AUTH_KEY) === '1';
}
function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}
function countryLabel(code){
  const c = COUNTRIES.find(c => c.code === code);
  return c ? c.label : code;
}
function getSubscribers(){
  return subscribersCache;
}
let subscribersCache = [];
function cacheSubscribersLocally(list){
  try{ localStorage.setItem(SUBSCRIBERS_KEY, JSON.stringify(list)); }
  catch(e){ /* ignore quota errors on the cache — not critical */ }
}
function readLocalSubscriberCache(){
  try{
    return JSON.parse(localStorage.getItem(SUBSCRIBERS_KEY)) || [];
  }catch(e){ return []; }
}
async function refreshSubscribersFromServer(){
  if(!GOOGLE_APPS_SCRIPT_URL){
    subscribersCache = readLocalSubscriberCache();
    return subscribersCache;
  }
  try{
    const res = await fetch(`${GOOGLE_APPS_SCRIPT_URL}?action=listSubscribers`);
    const data = await res.json();
    if(data && data.success && Array.isArray(data.subscribers)){
      subscribersCache = data.subscribers;
      cacheSubscribersLocally(subscribersCache);
    } else {
      throw new Error((data && data.error) || 'Unexpected response');
    }
  }catch(err){
    console.error('Could not load subscribers from the server, using local cache instead:', err);
    subscribersCache = readLocalSubscriberCache();
  }
  return subscribersCache;
}
// Adds a subscriber on the server (silently ignores duplicates there too),
// then refreshes the local cache. Returns true on success.
async function addSubscriberRemote(subscriber){
  if(!GOOGLE_APPS_SCRIPT_URL){
    const list = getSubscribers();
    list.push(subscriber);
    cacheSubscribersLocally(list);
    subscribersCache = list;
    return true;
  }
  try{
    const res = await fetch(GOOGLE_APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'addSubscriber', subscriber })
    });
    const data = await res.json();
    if(!data || !data.success) throw new Error((data && data.error) || 'Save failed');
    await refreshSubscribersFromServer();
    return true;
  }catch(err){
    console.error('Could not save subscriber to the server:', err);
    return false;
  }
}
// Deletes a subscriber on the server, then refreshes the local cache.
async function deleteSubscriberRemote(id){
  if(!GOOGLE_APPS_SCRIPT_URL){
    const list = getSubscribers().filter(s => s.id !== id);
    cacheSubscribersLocally(list);
    subscribersCache = list;
    return true;
  }
  try{
    const res = await fetch(GOOGLE_APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'deleteSubscriber', id })
    });
    const data = await res.json();
    if(!data || !data.success) throw new Error((data && data.error) || 'Delete failed');
    await refreshSubscribersFromServer();
    return true;
  }catch(err){
    console.error('Could not delete subscriber on the server:', err);
    return false;
  }
}
function isValidEmail(email){
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}

// Amazon SiteStripe's "Image" button gives you a full HTML snippet like
// <a href="..."><img src="https://m.media-amazon.com/images/I/xxxx.jpg" ...></a>
// instead of a plain image URL. This pulls the real image URL out of
// that snippet (or an amzn.to short-link's target isn't resolvable client
// side, so we just leave plain URLs untouched either way).
function extractImageUrl(input){
  if(!input) return input;
  const value = input.trim();
  // Looks like it contains an <img ...> tag somewhere — pull out src="...".
  if(/<img[\s>]/i.test(value)){
    const match = value.match(/<img[^>]*\ssrc=["']([^"']+)["']/i);
    if(match && match[1]) return match[1];
  }
  return value;
}

// Reads an uploaded image file, scales it down so it doesn't bloat
// localStorage, and hands back a data URL (a self-contained "embedded"
// image) via callback(dataUrl). maxDim caps the longer side in pixels.
function resizeImageFile(file, maxDim, quality, callback){
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      let width = img.width;
      let height = img.height;
      if(width > maxDim || height > maxDim){
        if(width >= height){
          height = Math.round(height * (maxDim / width));
          width = maxDim;
        } else {
          width = Math.round(width * (maxDim / height));
          height = maxDim;
        }
      }
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      // Keep PNGs as PNG (for transparency), everything else as JPEG.
      const mime = file.type === 'image/png' ? 'image/png' : 'image/jpeg';
      callback(canvas.toDataURL(mime, quality));
    };
    img.onerror = () => alert("Sorry, that file couldn't be read as an image.");
    img.src = e.target.result;
  };
  reader.onerror = () => alert("Sorry, that file couldn't be read.");
  reader.readAsDataURL(file);
}

/* =========================================================
   ROUTER
   ========================================================= */
window.addEventListener('hashchange', render);
window.addEventListener('DOMContentLoaded', async () => {
  // Paint immediately with whatever was cached locally (feels instant),
  // then fetch the real lists from the server and re-render.
  productsCache = readLocalProductCache();
  subscribersCache = readLocalSubscriberCache();
  render();
  await Promise.all([refreshProductsFromServer(), refreshSubscribersFromServer()]);
  await seedIfEmpty();
  render();
});

// Returns { name: 'home'|'admin'|'country', param: 'US'|null }
function currentRoute(){
  const raw = location.hash.replace('#','') || 'home';
  const parts = raw.split('/');
  return { name: parts[0], param: parts[1] || null };
}

function render(){
  const route = currentRoute();
  renderNav(route);
  const app = document.getElementById('app');
  if(route.name === 'admin'){
    app.innerHTML = isLoggedIn() ? '' : loginView();
    if(isLoggedIn()){ renderDashboard(app); }
    else{ attachLoginHandlers(); }
  } else if(route.name === 'country' && route.param){
    app.innerHTML = homeView(route.param);
    attachHomeHandlers(route.param);
  } else {
    app.innerHTML = homeView(null);
    attachHomeHandlers(null);
  }
}

function renderNav(route){
  const nav = document.getElementById('navArea');
  const countrySelectHtml = `
    <select id="countrySelect" title="Choose your country">
      <option value="">All countries</option>
      ${COUNTRIES.map(c => `<option value="${c.code}" ${route.name === 'country' && route.param === c.code ? 'selected' : ''}>${escapeHtml(c.label)}</option>`).join('')}
    </select>
  `;

  if(route.name === 'admin' && isLoggedIn()){
    nav.innerHTML = `${countrySelectHtml}<a href="#home">View site</a><button id="logoutBtn">Log out</button>`;
    document.getElementById('logoutBtn').onclick = () => {
      sessionStorage.removeItem(AUTH_KEY);
      location.hash = '#home';
    };
  } else {
    nav.innerHTML = `${countrySelectHtml}<a href="#admin">Admin</a>`;
  }

  const countrySelect = document.getElementById('countrySelect');
  countrySelect.onchange = () => {
    const val = countrySelect.value;
    location.hash = val ? `#country/${val}` : '#home';
  };
}

/* =========================================================
   HOME VIEW  (also used for country-specific pages)
   ========================================================= */
function homeView(countryCode){
  const allProducts = getProducts();
  const products = countryCode
    ? allProducts.filter(p => !p.country || p.country === 'ALL' || p.country === countryCode)
    : allProducts;
  const categories = [...new Set(products.map(p => p.category).filter(Boolean))];

  const banner = countryCode ? `
    <div class="country-banner">
      <span>Showing products for <b>${escapeHtml(countryLabel(countryCode))}</b></span>
      <a href="#home">View all products →</a>
    </div>
  ` : '';

  return `
    <div class="hero">
      <h1>Handpicked finds, one click away</h1>
      <p>A running list of products worth your attention. Tap any card to see it on Amazon.</p>
    </div>
    ${banner}
    <div class="controls">
      <input type="text" id="searchInput" placeholder="Search products…">
      <select id="categoryFilter">
        <option value="">All categories</option>
        ${categories.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('')}
      </select>
    </div>
    <div class="grid" id="productGrid"></div>

    <div class="subscribe-section">
      <div class="subscribe-copy">
        <h3>Get new finds in your inbox</h3>
        <p>Subscribe for occasional emails when we add new handpicked products. No spam.</p>
      </div>
      <form class="subscribe-form" id="subscribeForm">
        <input type="text" id="subName" placeholder="Your name">
        <input type="email" id="subEmail" placeholder="Your email">
        <button type="submit">Subscribe</button>
        <div class="subscribe-msg" id="subscribeMsg" style="display:none;"></div>
      </form>
    </div>
  `;
}

function attachHomeHandlers(countryCode){
  const searchInput = document.getElementById('searchInput');
  const categoryFilter = document.getElementById('categoryFilter');
  const draw = () => drawGrid(searchInput.value, categoryFilter.value, countryCode);
  searchInput.addEventListener('input', draw);
  categoryFilter.addEventListener('change', draw);
  draw();

  const subForm = document.getElementById('subscribeForm');
  const subMsg = document.getElementById('subscribeMsg');
  subForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const nameInput = document.getElementById('subName');
    const emailInput = document.getElementById('subEmail');
    const submitBtn = subForm.querySelector('button[type="submit"]');
    const name = nameInput.value.trim();
    const email = emailInput.value.trim();

    const showMsg = (text, ok) => {
      subMsg.textContent = text;
      subMsg.className = 'subscribe-msg ' + (ok ? 'ok' : 'err');
      subMsg.style.display = 'block';
    };

    if(!name || !email){
      showMsg('Please enter your name and email.', false);
      return;
    }
    if(!isValidEmail(email)){
      showMsg('Please enter a valid email address.', false);
      return;
    }
    const subscribers = getSubscribers();
    if(subscribers.some(s => s.email.toLowerCase() === email.toLowerCase())){
      showMsg("You're already subscribed with that email.", false);
      return;
    }

    submitBtn.disabled = true;
    const ok = await addSubscriberRemote({ id: cryptoId(), name, email, dateAdded: Date.now() });
    submitBtn.disabled = false;

    if(!ok){
      showMsg("Something went wrong — please try again in a moment.", false);
      return;
    }
    nameInput.value = '';
    emailInput.value = '';
    showMsg("Thanks! You're subscribed.", true);
  });
}

function drawGrid(search, category, countryCode){
  const grid = document.getElementById('productGrid');
  let products = getProducts();

  if(countryCode){
    products = products.filter(p => !p.country || p.country === 'ALL' || p.country === countryCode);
  }
  if(search){
    const s = search.toLowerCase();
    products = products.filter(p =>
      (p.title||'').toLowerCase().includes(s) ||
      (p.description||'').toLowerCase().includes(s)
    );
  }
  if(category){
    products = products.filter(p => p.category === category);
  }

  if(products.length === 0){
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">
      <h3>No products found</h3>
      <p>Try a different search, or check back soon for new finds.</p>
    </div>`;
    return;
  }

  grid.innerHTML = products.map(p => `
    <div class="card">
      <div class="price-tag">${getCurrency(p.country).symbol}${escapeHtml(p.price)}</div>
      <img src="${escapeHtml(p.imageUrl)}" alt="${escapeHtml(p.title)}" onerror="this.src='https://placehold.co/400x300/FAF7F0/1F5A50?text=No+Image'">
      ${p.category ? `<div class="cat">${escapeHtml(p.category)}</div>` : ''}
      <h3>${escapeHtml(p.title)}</h3>
      <p class="desc">${escapeHtml(p.description)}</p>
      <a class="buy-btn" href="${escapeHtml(p.affiliateUrl)}" target="_blank" rel="noopener noreferrer sponsored">View on Amazon →</a>
    </div>
  `).join('');
}

/* =========================================================
   ADMIN — LOGIN VIEW
   ========================================================= */
function loginView(){
  return `
    <div class="admin-wrap">
      <div class="login-box">
        <h2>Admin login</h2>
        <div class="field">
          <label for="pwInput">Password</label>
          <input type="password" id="pwInput" placeholder="Enter admin password">
        </div>
        <button class="btn-primary" id="loginBtn">Log in</button>
        <div class="error-msg" id="loginError" style="display:none;">Incorrect password. Try again.</div>
        <p class="note">Piksmore Admin Login</p>
      </div>
    </div>
  `;
}

function attachLoginHandlers(){
  const btn = document.getElementById('loginBtn');
  const input = document.getElementById('pwInput');
  const err = document.getElementById('loginError');
  const tryLogin = () => {
    if(input.value === ADMIN_PASSWORD){
      sessionStorage.setItem(AUTH_KEY, '1');
      render();
    } else {
      err.style.display = 'block';
    }
  };
  btn.onclick = tryLogin;
  input.addEventListener('keydown', e => { if(e.key === 'Enter') tryLogin(); });
}

/* =========================================================
   ADMIN — DASHBOARD
   ========================================================= */
function renderDashboard(app){
  app.innerHTML = `
    <div class="admin-wrap" style="max-width:900px;">
      <div class="dash-header">
        <h2>Manage products</h2>
        <button class="btn-primary" id="addNewBtn">+ Add product</button>
      </div>
      <div id="formSlot"></div>
      <div id="productList"></div>

      <div class="form-card" style="margin-top:30px;">
        <div class="dash-header" style="margin-bottom:14px;">
          <h3 style="font-family:var(--font-display);margin:0;">Newsletter subscribers</h3>
          <button class="btn-ghost" id="exportSubsBtn">Export CSV</button>
        </div>
        <div id="subscriberList"></div>
      </div>

      <div class="form-card">
        <h3 style="font-family:var(--font-display);margin-top:0;">Change admin password</h3>
        <div class="form-grid">
          <div class="field full">
            <label for="newPwInput">New password</label>
            <input type="password" id="newPwInput" placeholder="Enter a new admin password">
          </div>
        </div>
        <div class="form-actions">
          <button class="btn-ghost" id="savePwBtn">Save new password</button>
        </div>
        <p class="note">This is stored in your browser only (localStorage) and only protects this browser/device — it's not a secure, server-verified login.</p>
      </div>
    </div>
  `;
  document.getElementById('addNewBtn').onclick = () => showForm(document.getElementById('formSlot'), null);
  document.getElementById('savePwBtn').onclick = () => {
    const val = document.getElementById('newPwInput').value.trim();
    if(val.length < 4){ alert('Please choose a password at least 4 characters long.'); return; }
    ADMIN_PASSWORD = val;
    localStorage.setItem('sift_admin_pw', val);
    document.getElementById('newPwInput').value = '';
    alert('Admin password updated.');
  };
  drawProductList(document.getElementById('productList'));
  drawSubscriberList(document.getElementById('subscriberList'));

  document.getElementById('exportSubsBtn').onclick = () => {
    const subs = getSubscribers();
    if(subs.length === 0){ alert('No subscribers yet.'); return; }
    const rows = [['Name','Email','Date added'], ...subs.map(s => [s.name, s.email, new Date(s.dateAdded).toLocaleString()])];
    const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'subscribers.csv';
    a.click();
    URL.revokeObjectURL(a.href);
  };
}

function drawSubscriberList(container){
  const subs = getSubscribers();
  if(subs.length === 0){
    container.innerHTML = `<p class="note" style="margin-top:0;">No subscribers yet.</p>`;
    return;
  }
  container.innerHTML = subs.slice().reverse().map(s => `
    <div class="product-row" data-id="${s.id}" style="padding:10px 14px;">
      <div class="info">
        <div class="t">${escapeHtml(s.name)}</div>
        <div class="p">${escapeHtml(s.email)} · ${new Date(s.dateAdded).toLocaleDateString()}</div>
      </div>
      <div class="row-actions">
        <button class="del">Remove</button>
      </div>
    </div>
  `).join('');

  container.querySelectorAll('.del').forEach(btn => {
    btn.onclick = async (e) => {
      const id = e.target.closest('.product-row').dataset.id;
      btn.disabled = true;
      btn.textContent = 'Removing…';
      const ok = await deleteSubscriberRemote(id);
      if(!ok){
        alert("Couldn't remove this subscriber on the server. Check your connection and try again.");
        btn.disabled = false;
        btn.textContent = 'Remove';
        return;
      }
      drawSubscriberList(container);
    };
  });
}

function drawProductList(container){
  const products = getProducts();
  if(products.length === 0){
    container.innerHTML = `<div class="empty-state"><h3>No products yet</h3><p>Add your first product to get started.</p></div>`;
    return;
  }
  container.innerHTML = products.map(p => `
    <div class="product-row" data-id="${p.id}">
      <img src="${escapeHtml(p.imageUrl)}" alt="" onerror="this.src='https://placehold.co/100x100/FAF7F0/1F5A50?text=—'">
      <div class="info">
        <div class="t">${escapeHtml(p.title)}</div>
        <div class="p">${getCurrency(p.country).symbol}${escapeHtml(p.price)} · ${escapeHtml(p.category || 'Uncategorized')} · ${p.country && p.country !== 'ALL' ? escapeHtml(countryLabel(p.country)) : 'All countries'}</div>
      </div>
      <div class="row-actions">
        <button class="edit">Edit</button>
        <button class="del">Delete</button>
      </div>
    </div>
  `).join('');

  container.querySelectorAll('.edit').forEach(btn => {
    btn.onclick = (e) => {
      const id = e.target.closest('.product-row').dataset.id;
      const product = getProducts().find(p => p.id === id);
      showForm(document.getElementById('formSlot'), product);
      document.getElementById('formSlot').scrollIntoView({behavior:'smooth'});
    };
  });
  container.querySelectorAll('.del').forEach(btn => {
    btn.onclick = async (e) => {
      const id = e.target.closest('.product-row').dataset.id;
      const product = getProducts().find(p => p.id === id);
      if(confirm(`Delete "${product.title}"? This can't be undone.`)){
        btn.disabled = true;
        btn.textContent = 'Deleting…';
        const ok = await deleteProductRemote(id);
        if(!ok){
          alert("Couldn't delete this product on the server. Check your internet connection and that GOOGLE_APPS_SCRIPT_URL is set correctly, then try again.");
          btn.disabled = false;
          btn.textContent = 'Delete';
          return;
        }
        drawProductList(container);
      }
    };
  });
}

function showForm(slot, product){
  const isEdit = !!product;
  slot.innerHTML = `
    <div class="form-card">
      <h3 style="font-family:var(--font-display);margin-top:0;">${isEdit ? 'Edit product' : 'Add a new product'}</h3>
      <div class="form-grid">
        <div class="field full">
          <label>Product title</label>
          <input type="text" id="f_title" value="${isEdit ? escapeHtml(product.title) : ''}" placeholder="e.g. Insulated Water Bottle 32oz">
        </div>
        <div class="field full">
          <label>Description</label>
          <textarea id="f_desc" placeholder="A short, honest description of the product">${isEdit ? escapeHtml(product.description) : ''}</textarea>
        </div>
        <div class="field">
          <label>Available in</label>
          <select id="f_country">
            <option value="ALL" ${isEdit && (!product.country || product.country === 'ALL') ? 'selected' : ''}>All countries</option>
            ${COUNTRIES.map(c => `<option value="${c.code}" ${isEdit && product.country === c.code ? 'selected' : ''}>${escapeHtml(c.label)} only</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label id="priceLabel">Price (${getCurrency(isEdit ? (product.country || 'ALL') : 'ALL').code})</label>
          <input type="text" id="f_price" value="${isEdit ? escapeHtml(product.price) : ''}" placeholder="19.99">
        </div>
        <div class="field">
          <label>Category</label>
          <input type="text" id="f_cat" value="${isEdit ? escapeHtml(product.category) : ''}" placeholder="e.g. Kitchen">
        </div>
        <div class="field full">
          <label>Image URL</label>
          <input type="text" id="f_img" value="${isEdit ? escapeHtml(product.imageUrl) : ''}" placeholder="https://... or paste the SiteStripe Image snippet">
          <div class="hint">Paste a plain image URL, or paste the whole SiteStripe "Image" HTML snippet — we'll pull the image link out of it automatically.</div>
        </div>
        <div class="field full">
          <label>Or upload an image from your device</label>
          <input type="file" id="f_imgFile" accept="image/*">
          <div class="hint">This fills in the Image URL field above with an embedded copy of the photo (auto-resized). It's stored inside your browser, so it's best for a handful of images rather than hundreds.</div>
        </div>
        <div class="field full" id="imgPreviewField" style="${(isEdit && product.imageUrl) ? '' : 'display:none;'}">
          <label>Preview</label>
          <img id="imgPreview" src="${isEdit ? escapeHtml(product.imageUrl) : ''}" alt="" style="max-width:160px;max-height:160px;object-fit:contain;background:var(--paper-dim);border:1px solid var(--line);border-radius:3px;padding:6px;display:block;">
        </div>
        <div class="field full">
          <label>Amazon affiliate link</label>
          <input type="text" id="f_url" value="${isEdit ? escapeHtml(product.affiliateUrl) : ''}" placeholder="https://www.amazon.com/dp/XXXXXXX?tag=yourtag-20">
        </div>
      </div>
      <div class="form-actions">
        <button class="btn-primary" id="saveProductBtn">${isEdit ? 'Save changes' : 'Add product'}</button>
        <button class="btn-ghost" id="cancelFormBtn">Cancel</button>
      </div>
    </div>
  `;

  document.getElementById('cancelFormBtn').onclick = () => { slot.innerHTML = ''; };
  document.getElementById('f_country').onchange = (e) => {
    document.getElementById('priceLabel').textContent = `Price (${getCurrency(e.target.value).code})`;
  };

  const imgUrlInput = document.getElementById('f_img');
  const imgFileInput = document.getElementById('f_imgFile');
  const imgPreview = document.getElementById('imgPreview');
  const imgPreviewField = document.getElementById('imgPreviewField');

  const updatePreview = (url) => {
    if(url){
      imgPreview.src = url;
      imgPreviewField.style.display = '';
    } else {
      imgPreviewField.style.display = 'none';
    }
  };
  imgUrlInput.addEventListener('input', () => updatePreview(extractImageUrl(imgUrlInput.value)));

  imgFileInput.addEventListener('change', () => {
    const file = imgFileInput.files[0];
    if(!file) return;
    if(!file.type.startsWith('image/')){
      alert('Please choose an image file.');
      imgFileInput.value = '';
      return;
    }
    resizeImageFile(file, 900, 0.82, async (dataUrl) => {
      // Show it right away, and use it as a fallback if Drive upload isn't
      // set up or fails.
      updatePreview(dataUrl);
      imgUrlInput.value = dataUrl;

      if(GOOGLE_DRIVE_UPLOAD_URL){
        imgUrlInput.value = 'Uploading to Google Drive…';
        try{
          const res = await fetch(GOOGLE_DRIVE_UPLOAD_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ imageData: dataUrl, filename: file.name })
          });
          const result = await res.json();
          if(result && result.success && result.url){
            imgUrlInput.value = result.url;
            updatePreview(result.url);
          } else {
            throw new Error(result && result.error ? result.error : 'Unknown upload error');
          }
        } catch(err){
          console.error('Drive upload failed, using an embedded copy instead:', err);
          imgUrlInput.value = dataUrl;
          updatePreview(dataUrl);
          alert("Couldn't upload to Google Drive, so an embedded copy is being used instead (stored in this browser). Double-check GOOGLE_DRIVE_UPLOAD_URL and that the Apps Script is deployed with access set to \"Anyone.\"");
        }
      }
      imgFileInput.value = ''; // ready to accept another upload if needed
    });
  });

  const saveBtn = document.getElementById('saveProductBtn');
  saveBtn.onclick = async () => {
    const title = document.getElementById('f_title').value.trim();
    const description = document.getElementById('f_desc').value.trim();
    const price = document.getElementById('f_price').value.trim();
    const category = document.getElementById('f_cat').value.trim();
    const country = document.getElementById('f_country').value;
    const imageUrl = extractImageUrl(imgUrlInput.value);
    const affiliateUrl = document.getElementById('f_url').value.trim();

    if(!title || !affiliateUrl){
      alert('Title and Amazon affiliate link are required.');
      return;
    }

    const productToSave = isEdit
      ? {...product, title, description, price, category, country, imageUrl, affiliateUrl}
      : { id: cryptoId(), title, description, price, category, country, imageUrl, affiliateUrl, dateAdded: Date.now() };

    saveBtn.disabled = true;
    const originalLabel = saveBtn.textContent;
    saveBtn.textContent = 'Saving…';

    const ok = await saveProductRemote(productToSave);
    if(!ok){
      alert("Couldn't save to the server. Check your internet connection and that GOOGLE_APPS_SCRIPT_URL is set correctly (see apps-script-backend.gs), then try again. Your changes were NOT saved.");
      saveBtn.disabled = false;
      saveBtn.textContent = originalLabel;
      return;
    }
    slot.innerHTML = '';
    drawProductList(document.getElementById('productList'));
  };
}
</script>
